[program:laravel-queue-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php {{PROJECT_PATH}}/artisan queue:work --queue=high,default --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
user={{USER}}
redirect_stderr=true
stdout_logfile={{PROJECT_PATH}}/storage/logs/queue-worker-high.log
stopwaitsecs=3600

# High priority queue for time-sensitive emails
numprocs=1